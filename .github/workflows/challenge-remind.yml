# 거너스 챌린지 알림 크론 (0원). 30분마다 /api/cron/remind 를 호출한다.
# 저장소 Settings → Secrets 에 CHALLENGE_URL (예: https://xxx.vercel.app), CHALLENGE_CRON_SECRET 을 넣으면 동작.
# GitHub 크론은 몇 분 늦을 수 있다. 더 정확한 시각이 필요하면 README 의 Supabase pg_cron 방법을 쓴다.
name: challenge-remind
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    if: ${{ vars.CHALLENGE_REMIND_ENABLED != 'false' }}
    steps:
      - name: call remind endpoint
        env:
          URL: ${{ secrets.CHALLENGE_URL }}
          KEY: ${{ secrets.CHALLENGE_CRON_SECRET }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "secrets not set; skipping"; exit 0; fi
          URL="${URL%/}"
          # 상태 코드와 응답 본문을 같이 남긴다 (비밀값은 안 찍힘). 401=CRON_SECRET 불일치, 404=주소 오류, 500=앱 오류
          code=$(curl -sS -o /tmp/body -w "%{http_code}" -H "x-cron-secret: $KEY" "$URL/api/cron/remind")
          echo "HTTP $code"; head -c 2000 /tmp/body; echo
          case "$code" in 2*) exit 0;; esac
          echo "::error::remind endpoint returned HTTP $code (401: CHALLENGE_CRON_SECRET 가 Vercel 의 CRON_SECRET 과 다름 / 404: CHALLENGE_URL 확인 / 5xx: 앱 오류, 본문 참고)"
          exit 1
